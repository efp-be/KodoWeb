# Deploys the site to Railway after every push on main (so after every merged pull request).
# The RAILWAY_TOKEN secret is a Railway project token, set in the repository settings by the trainer.
name: Deploy

on:
  push:
    branches: [main]

# One deployment at a time: a new push waits for the previous deployment to finish
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  railway:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SERVICE_ID: 1889db91-09ee-451b-870a-4091d106f058
    steps:
      - uses: actions/checkout@v4
      - run: railway up --service="$SERVICE_ID" --ci
